name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q LyricsPlusBedrock.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - run: gradle assembleDebug --no-daemon
        working-directory: LyricsPlusBedrock
      - uses: actions/upload-artifact@v4
        with:
          name: LyricsPlusBedrock-apk
          path: LyricsPlusBedrock/app/build/outputs/apk/debug/*.apk
